<!DOCTYPE html>
<html lang="en">
<head>
    <title>Campus Marketplace – Browse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body>

    <!-- Navbar -->
    <nav class="top-navbar">
        <button id="signOutButton" class="btn btn-primary">Sign out</button>
        <br>
        <a href="index.html">
            <img src="Images/campus_marketplace_logo.png" alt="Campus Marketplace logo" class="home-logo" width="50%" />
        </a>
    </nav>

    <!-- Page header -->
    <div class="page-header">
        <h2>🛒 Browse Marketplace</h2>
        <p>Items listed by other Macquarie students</p>
    </div>

    <!-- Category filter -->
    <div class="filter-bar">
        <label for="categoryFilter">Filter by category:</label>
        <select id="categoryFilter" class="filter-select">
            <option value="all">All Categories</option>
            <option value="Textbook">Textbook</option>
            <option value="Electronics">Equipment</option>
            <option value="Furniture">Furniture</option>
        </select>
        <span id="itemCount" class="text-muted ms-auto" style="font-size:0.88rem;"></span>
    </div>

    <!-- Items grid -->
    <div class="items-section">
        <div class="container-fluid">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Loading listings...</p>
            </div>

            <div id="itemsContainer" class="row g-4" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">🔍</p>
                <p>No items found in this category.</p>
            </div>

        </div>
    </div>

    <script src="app.js" type="module"></script>

</body>
</html>
