<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – Browse</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Navbar -->
    <nav class="top-navbar">
        <a href="index.html">
            <img src="Images/campus_marketplace_logo.png" alt="Campus Marketplace logo" />
        </a>
        <div class="nav-links">
            <a href="index.html" class="btn-home">← Home</a>
            <button id="signOutBtn" class="btn-signout">Sign Out</button>
        </div>
    </nav>

    <!-- Page header -->
    <div class="page-header">
        <h2>🛒 Browse Marketplace</h2>
        <p>Items listed by other Macquarie students</p>
    </div>

    <!-- Category filter -->
    <div class="filter-bar">
        <label for="categoryFilter">Filter by category:</label>
        <select id="categoryFilter" class="filter-select">
            <option value="all">All Categories</option>
            <option value="Textbooks">Textbooks</option>
            <option value="Electronics">Electronics</option>
            <option value="Furniture">Furniture</option>
        </select>
        <span id="itemCount" class="text-muted ms-auto" style="font-size:0.88rem;"></span>
    </div>

    <!-- Items grid -->
    <div class="items-section">
        <div class="container-fluid">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-primary" role="status"></div>
                <p>Loading listings...</p>
            </div>

            <div id="itemsContainer" class="row g-4" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">🔍</p>
                <p>No items found in this category.</p>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        Campus Marketplace &copy; 2026 · Macquarie University
    </footer>

    <script src="marketplace.js" type="module"></script>

</body>
</html>
