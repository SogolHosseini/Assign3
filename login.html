<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a3c5e 0%, #2d7dd2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
        }

        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 16px 48px rgba(0, 0, 0, 0.22);
            padding: 44px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-card .logo-wrap {
            text-align: center;
            margin-bottom: 24px;
        }
        .login-card .logo-wrap img {
            width: 180px;
        }

        .login-card h2 {
            text-align: center;
            font-size: 1.4rem;
            font-weight: 700;
            color: #1a3c5e;
            margin-bottom: 6px;
        }
        .login-card .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        .form-label {
            font-weight: 500;
            color: #343a40;
            font-size: 0.92rem;
        }
        .form-control {
            border-radius: 10px;
            border: 1.5px solid #ced4da;
            padding: 10px 14px;
            font-size: 0.95rem;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .form-control:focus {
            border-color: #2566a8;
            box-shadow: 0 0 0 3px rgba(37, 102, 168, 0.15);
        }

        .btn-signin {
            background: linear-gradient(135deg, #1a3c5e, #2566a8);
            color: #fff;
            border: none;
            border-radius: 10px;
            padding: 12px;
            font-size: 1rem;
            font-weight: 600;
            width: 100%;
            margin-top: 8px;
            transition: opacity 0.15s;
        }
        .btn-signin:hover   { opacity: 0.9; }
        .btn-signin:active  { opacity: 0.8; }
        .btn-signin:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #messageArea {
            min-height: 20px;
            text-align: center;
            font-size: 0.9rem;
            margin-top: 14px;
            font-weight: 500;
        }

        .footer-note {
            text-align: center;
            margin-top: 24px;
            color: #adb5bd;
            font-size: 0.78rem;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <!-- Logo -->
        <div class="logo-wrap">
            <img src="campus_marketplace_logo.png" alt="Campus Marketplace" />
        </div>

        <h2>Sign In</h2>
        <p class="subtitle">Use your university email and password</p>

        <!-- Login form -->
        <div class="mb-3">
            <label for="emailInput" class="form-label">Email address</label>
            <input
                type="email"
                id="emailInput"
                class="form-control"
                placeholder="student@students.mq.edu.au"
                autocomplete="email"
            />
        </div>

        <div class="mb-3">
            <label for="passwordInput" class="form-label">Password</label>
            <input
                type="password"
                id="passwordInput"
                class="form-control"
                placeholder="Enter your password"
                autocomplete="current-password"
            />
        </div>

        <button id="signInButton" class="btn-signin">Sign In</button>

        <div id="messageArea"></div>

        <p class="footer-note">Campus Marketplace &copy; 2026 · Macquarie University</p>
    </div>

    <script src="app.js" type="module"></script>

</body>
</html>
