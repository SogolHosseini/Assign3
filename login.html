<!DOCTYPE html>
<html>

<head>
  <title>Login Page</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="text-center">
  <img src="Images/campus_marketplace_logo.png" width="50%" />

  <p>Please login with your Macquarie University email:</p>

  <form>
    <label for="email">Email:</label><br>
    <input type="email" id="emailInput" style="width: 300px; margin: auto; display: block; margin-bottom: 10px;">
    <label for="password">Password:</label><br>
    <input type="password" id="passwordInput" style="width: 300px; margin: auto; display: block;">
  </form>

  <br>

  <button id="signInButton" class="btn btn-primary">Sign In</button>

  <p id="messageArea"></p>
  <script src="app.js" type="module"></script>

</body>

</html>
