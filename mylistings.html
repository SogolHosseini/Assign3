<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – My Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Navbar -->
    <nav class="top-navbar">
        <a href="index.html">
            <img src="campus_marketplace_logo.png" alt="Campus Marketplace logo" />
        </a>
        <div class="nav-links">
            <a href="index.html" class="btn-home">← Home</a>
            <button id="signOutBtn" class="btn-signout">Sign Out</button>
        </div>
    </nav>

    <!-- Page header -->
    <div class="page-header-green">
        <h2>📦 My Listings</h2>
        <p>Items you have listed on the marketplace</p>
    </div>

    <!-- Items grid -->
    <div class="items-section">
        <div class="container-fluid">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-success" role="status"></div>
                <p>Loading your listings…</p>
            </div>

            <div id="itemsContainer" class="row g-4" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">📭</p>
                <p>You haven't listed any items yet.</p>
                <p class="text-muted" style="font-size:0.9rem;">Add items directly in the Firebase Console to have them appear here.</p>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        Campus Marketplace &copy; 2026 · Macquarie University
    </footer>

    <!-- Firebase script -->
    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // Firebase project config
        const firebaseConfig = {
            apiKey:            "AIzaSyB0mfNZJtuwNUudgM83nX7soxlsXdwfs3A",
            authDomain:        "comp2750-a3.firebaseapp.com",
            projectId:         "comp2750-a3",
            storageBucket:     "comp2750-a3.firebasestorage.app",
            messagingSenderId: "671623399244",
            appId:             "1:671623399244:web:99e442a49e22d3090ff1e9"
        };

        // start Firebase
        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // check if user is logged in - redirect to login if not
        onAuthStateChanged(auth, async function(user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            await loadMyListings(user);
        });

        // load items that belong to the current user
        async function loadMyListings(user) {
            const container  = document.getElementById("itemsContainer");
            const loadingMsg = document.getElementById("loadingMsg");
            const emptyMsg   = document.getElementById("emptyMsg");

            try {
                // query for items where sellerUID matches the current user
                const q        = query(collection(db, "items"), where("sellerUID", "==", user.uid));
                const snapshot = await getDocs(q);

                loadingMsg.style.display = "none";

                if (snapshot.empty) {
                    emptyMsg.style.display = "block";
                    return;
                }

                snapshot.forEach(function(docSnap) {
                    const item = docSnap.data();
                    const priceLabel = (item.price === "Trade" || item.price === 0 || item.price === "")
                        ? "Trade"
                        : "$" + item.price;

                    const col = document.createElement("div");
                    col.className = "col-xl-3 col-lg-4 col-md-6";
                    col.innerHTML = `
                        <div class="card item-card">
                            <img
                                src="${item.imageURL || ""}"
                                class="card-img-top"
                                alt="${item.name}"
                                onerror="this.style.background='#dde3ea'; this.removeAttribute('src');"
                            />
                            <div class="card-body">
                                <span class="badge-category-green">${item.category || "Other"}</span>
                                <span class="my-listing-badge">Your listing</span>
                                <p class="item-title">${item.name}</p>
                                <p class="item-description">${item.description}</p>
                                <p class="item-price">${priceLabel}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });

                container.style.display = "flex";

            } catch (err) {
                loadingMsg.innerHTML = `<p class="text-danger">Error loading your listings. Please refresh.</p>`;
                console.error(err);
            }
        }

        // sign out button
        document.getElementById("signOutBtn").addEventListener("click", async function() {
            await signOut(auth);
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
