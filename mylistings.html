<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – My Listings</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ── Navbar ── */
        .top-navbar {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-navbar img { height: 40px; }
        .nav-links { display: flex; align-items: center; gap: 12px; }
        .btn-home {
            background: #1a3c5e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-home:hover { background: #255a8a; color: #fff; }
        .btn-signout {
            border: 1.5px solid #dc3545;
            color: #dc3545;
            background: transparent;
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-signout:hover { background: #dc3545; color: #fff; }

        /* ── Page header ── */
        .page-header {
            background: linear-gradient(135deg, #1a6e2e, #38a169);
            color: #fff;
            padding: 36px 24px 28px;
            text-align: center;
        }
        .page-header h2 { font-weight: 700; margin-bottom: 4px; }
        .page-header p  { opacity: 0.82; margin: 0; }

        /* ── Main content ── */
        .items-section { padding: 32px 24px 60px; }

        /* ── Item cards ── */
        .item-card {
            border: none;
            border-radius: 14px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.08);
            overflow: hidden;
            height: 100%;
        }
        .item-card .card-img-top {
            height: 180px;
            object-fit: cover;
            background: #e9ecef;
        }
        .item-card .card-body {
            display: flex;
            flex-direction: column;
            padding: 18px;
        }
        .item-title       { font-size: 1.05rem; font-weight: 650; color: #1a3c5e; margin-bottom: 4px; }
        .item-description { font-size: 0.88rem; color: #6c757d; flex-grow: 1; margin-bottom: 10px; }
        .item-price       { font-size: 1.1rem; font-weight: 700; color: #1a6e2e; margin-bottom: 4px; }
        .badge-category {
            font-size: 0.72rem; font-weight: 600;
            padding: 4px 10px; border-radius: 20px;
            background: #e2f5e8; color: #1a6e2e;
            margin-bottom: 10px; display: inline-block;
        }
        .my-listing-badge {
            font-size: 0.72rem; font-weight: 600;
            padding: 4px 10px; border-radius: 20px;
            background: #fff3cd; color: #856404;
            display: inline-block; margin-bottom: 10px;
        }

        /* ── Status messages ── */
        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        /* ── Footer ── */
        .page-footer {
            text-align: center;
            padding: 20px;
            color: #adb5bd;
            font-size: 0.82rem;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

    <!-- ── Navbar ── -->
    <nav class="top-navbar">
        <a href="index.html">
            <img src="campus_marketplace_logo.png" alt="Campus Marketplace logo" />
        </a>
        <div class="nav-links">
            <a href="index.html" class="btn-home">← Home</a>
            <button id="signOutBtn" class="btn-signout">Sign Out</button>
        </div>
    </nav>

    <!-- ── Page header ── -->
    <div class="page-header">
        <h2>📦 My Listings</h2>
        <p>Items you have listed on the marketplace</p>
    </div>

    <!-- ── Items grid ── -->
    <div class="items-section">
        <div class="container-fluid">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-success" role="status"></div>
                <p>Loading your listings…</p>
            </div>

            <div id="itemsContainer" class="row g-4" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">📭</p>
                <p>You haven't listed any items yet.</p>
                <p class="text-muted" style="font-size:0.9rem;">Add items directly in the Firebase Console to have them appear here.</p>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        Campus Marketplace &copy; 2026 · Macquarie University
    </footer>

    <!-- ── Firebase script ── -->
    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // Firebase project configuration
        const firebaseConfig = {
            apiKey:            "AIzaSyB0mfNZJtuwNUudgM83nX7soxlsXdwfs3A",
            authDomain:        "comp2750-a3.firebaseapp.com",
            projectId:         "comp2750-a3",
            storageBucket:     "comp2750-a3.firebasestorage.app",
            messagingSenderId: "671623399244",
            appId:             "1:671623399244:web:99e442a49e22d3090ff1e9"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // Redirect if not signed in
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            await loadMyListings(user);
        });

        // Load only items that belong to the signed-in user
        async function loadMyListings(user) {
            const container  = document.getElementById("itemsContainer");
            const loadingMsg = document.getElementById("loadingMsg");
            const emptyMsg   = document.getElementById("emptyMsg");

            try {
                // Query Firestore for items where sellerUID matches the current user
                const q        = query(collection(db, "items"), where("sellerUID", "==", user.uid));
                const snapshot = await getDocs(q);

                loadingMsg.style.display = "none";

                if (snapshot.empty) {
                    emptyMsg.style.display = "block";
                    return;
                }

                snapshot.forEach(docSnap => {
                    const item  = docSnap.data();
                    const priceLabel = (item.price === "Trade" || item.price === 0 || item.price === "")
                        ? "Trade"
                        : `$${item.price}`;

                    const col = document.createElement("div");
                    col.className = "col-xl-3 col-lg-4 col-md-6";
                    col.innerHTML = `
                        <div class="card item-card">
                            <img
                                src="${item.imageURL || ""}"
                                class="card-img-top"
                                alt="${item.name}"
                                onerror="this.style.background='#dde3ea'; this.removeAttribute('src');"
                            />
                            <div class="card-body">
                                <span class="badge-category">${item.category || "Other"}</span>
                                <span class="my-listing-badge">Your listing</span>
                                <p class="item-title">${item.name}</p>
                                <p class="item-description">${item.description}</p>
                                <p class="item-price">${priceLabel}</p>
                            </div>
                        </div>
                    `;
                    container.appendChild(col);
                });

                container.style.display = "flex";

            } catch (err) {
                loadingMsg.innerHTML = `<p class="text-danger">Failed to load your listings. Please refresh.</p>`;
                console.error("Firestore error:", err);
            }
        }

        // Sign out
        document.getElementById("signOutBtn").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
