<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – My Shortlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body {
            background-color: #f5f7fa;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* ── Navbar ── */
        .top-navbar {
            background: #ffffff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .top-navbar img { height: 40px; }
        .nav-links { display: flex; align-items: center; gap: 12px; }
        .btn-home {
            background: #1a3c5e;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            text-decoration: none;
            transition: background 0.15s;
        }
        .btn-home:hover { background: #255a8a; color: #fff; }
        .btn-signout {
            border: 1.5px solid #dc3545;
            color: #dc3545;
            background: transparent;
            border-radius: 8px;
            padding: 6px 16px;
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .btn-signout:hover { background: #dc3545; color: #fff; }

        /* ── Page header ── */
        .page-header {
            background: linear-gradient(135deg, #7c4d0f, #e07b1a);
            color: #fff;
            padding: 36px 24px 28px;
            text-align: center;
        }
        .page-header h2 { font-weight: 700; margin-bottom: 4px; }
        .page-header p  { opacity: 0.82; margin: 0; }

        /* ── Main content ── */
        .items-section { padding: 32px 24px 60px; }

        /* ── Shortlist rows ── */
        .shortlist-item {
            background: #fff;
            border-radius: 14px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.07);
            padding: 20px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-bottom: 14px;
            transition: box-shadow 0.15s;
        }
        .shortlist-item:hover { box-shadow: 0 6px 18px rgba(0,0,0,0.12); }
        .shortlist-item-info { flex: 1; }
        .shortlist-item-name {
            font-size: 1.05rem;
            font-weight: 650;
            color: #1a3c5e;
            margin-bottom: 4px;
        }
        .shortlist-item-meta {
            font-size: 0.84rem;
            color: #6c757d;
        }
        .shortlist-item-price {
            font-size: 1.05rem;
            font-weight: 700;
            color: #1a6e2e;
            white-space: nowrap;
        }
        .btn-remove {
            background: transparent;
            border: 1.5px solid #dc3545;
            color: #dc3545;
            border-radius: 8px;
            padding: 7px 16px;
            font-size: 0.86rem;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            transition: background 0.15s, color 0.15s;
        }
        .btn-remove:hover { background: #dc3545; color: #fff; }

        /* ── Status messages ── */
        .status-msg {
            text-align: center;
            padding: 60px 20px;
            color: #6c757d;
        }

        /* ── Footer ── */
        .page-footer {
            text-align: center;
            padding: 20px;
            color: #adb5bd;
            font-size: 0.82rem;
            border-top: 1px solid #e9ecef;
        }
    </style>
</head>
<body>

    <!-- ── Navbar ── -->
    <nav class="top-navbar">
        <a href="index.html">
            <img src="campus_marketplace_logo.png" alt="Campus Marketplace logo" />
        </a>
        <div class="nav-links">
            <a href="index.html" class="btn-home">← Home</a>
            <button id="signOutBtn" class="btn-signout">Sign Out</button>
        </div>
    </nav>

    <!-- ── Page header ── -->
    <div class="page-header">
        <h2>⭐ My Shortlist</h2>
        <p>Items you have saved from the marketplace</p>
    </div>

    <!-- ── Shortlist content ── -->
    <div class="items-section">
        <div class="container" style="max-width: 720px;">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-warning" role="status"></div>
                <p>Loading your shortlist…</p>
            </div>

            <div id="shortlistContainer" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">⭐</p>
                <p>Your shortlist is empty.</p>
                <p class="text-muted" style="font-size:0.9rem;">
                    Head to the <a href="marketplace.html">Marketplace</a> and save items that interest you.
                </p>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        Campus Marketplace &copy; 2026 · Macquarie University
    </footer>

    <!-- ── Firebase script ── -->
    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, deleteDoc }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // Firebase project configuration
        const firebaseConfig = {
            apiKey:            "AIzaSyB0mfNZJtuwNUudgM83nX7soxlsXdwfs3A",
            authDomain:        "comp2750-a3.firebaseapp.com",
            projectId:         "comp2750-a3",
            storageBucket:     "comp2750-a3.firebasestorage.app",
            messagingSenderId: "671623399244",
            appId:             "1:671623399244:web:99e442a49e22d3090ff1e9"
        };

        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // Redirect if not signed in
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            await loadShortlist(user);
        });

        // Load the user's shortlisted items from Firestore
        async function loadShortlist(user) {
            const container  = document.getElementById("shortlistContainer");
            const loadingMsg = document.getElementById("loadingMsg");
            const emptyMsg   = document.getElementById("emptyMsg");

            try {
                // Get all shortlist documents that belong to this user
                const q        = query(collection(db, "shortlists"), where("userId", "==", user.uid));
                const snapshot = await getDocs(q);

                loadingMsg.style.display = "none";

                if (snapshot.empty) {
                    emptyMsg.style.display = "block";
                    return;
                }

                container.style.display = "block";

                for (const shortlistDoc of snapshot.docs) {
                    const { itemId } = shortlistDoc.data();

                    // Fetch the full item details from the items collection
                    const itemSnap = await getDoc(doc(db, "items", itemId));
                    if (!itemSnap.exists()) continue;   // item may have been removed

                    const item       = itemSnap.data();
                    const priceLabel = (item.price === "Trade" || item.price === 0 || item.price === "")
                        ? "Trade"
                        : `$${item.price}`;

                    const row = document.createElement("div");
                    row.className    = "shortlist-item";
                    row.dataset.docId = shortlistDoc.id;
                    row.innerHTML    = `
                        <div class="shortlist-item-info">
                            <p class="shortlist-item-name">${item.name}</p>
                            <p class="shortlist-item-meta">${item.category || "Other"} · Seller: ${item.sellerEmail}</p>
                        </div>
                        <span class="shortlist-item-price">${priceLabel}</span>
                        <button class="btn-remove" data-doc-id="${shortlistDoc.id}">Remove</button>
                    `;

                    container.appendChild(row);
                }

                // Wire up remove buttons
                attachRemoveHandlers(db);

            } catch (err) {
                loadingMsg.innerHTML = `<p class="text-danger">Failed to load shortlist. Please refresh.</p>`;
                console.error("Firestore error:", err);
            }
        }

        // Remove a shortlisted item from Firestore and the DOM
        function attachRemoveHandlers(db) {
            document.querySelectorAll(".btn-remove").forEach(btn => {
                btn.addEventListener("click", async () => {
                    const docId = btn.dataset.docId;
                    btn.disabled    = true;
                    btn.textContent = "Removing…";

                    try {
                        await deleteDoc(doc(db, "shortlists", docId));

                        // Remove the row from the DOM
                        const row = document.querySelector(`.shortlist-item[data-doc-id="${docId}"]`);
                        if (row) row.remove();

                        // Show empty state if nothing left
                        const remaining = document.querySelectorAll(".shortlist-item").length;
                        if (remaining === 0) {
                            document.getElementById("shortlistContainer").style.display = "none";
                            document.getElementById("emptyMsg").style.display           = "block";
                        }

                    } catch (err) {
                        btn.disabled    = false;
                        btn.textContent = "Remove";
                        alert("Could not remove item. Please try again.");
                        console.error("Remove error:", err);
                    }
                });
            });
        }

        // Sign out
        document.getElementById("signOutBtn").addEventListener("click", async () => {
            await signOut(auth);
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
