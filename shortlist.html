<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Marketplace – My Shortlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>

    <!-- Navbar -->
    <nav class="top-navbar">
        <a href="index.html">
            <img src="campus_marketplace_logo.png" alt="Campus Marketplace logo" />
        </a>
        <div class="nav-links">
            <a href="index.html" class="btn-home">← Home</a>
            <button id="signOutBtn" class="btn-signout">Sign Out</button>
        </div>
    </nav>

    <!-- Page header -->
    <div class="page-header-amber">
        <h2>⭐ My Shortlist</h2>
        <p>Items you have saved from the marketplace</p>
    </div>

    <!-- Shortlist content -->
    <div class="items-section">
        <div class="container" style="max-width: 720px;">

            <div id="loadingMsg" class="status-msg">
                <div class="spinner-border text-warning" role="status"></div>
                <p>Loading your shortlist…</p>
            </div>

            <div id="shortlistContainer" style="display:none;"></div>

            <div id="emptyMsg" class="status-msg" style="display:none;">
                <p style="font-size:2rem;">⭐</p>
                <p>Your shortlist is empty.</p>
                <p class="text-muted" style="font-size:0.9rem;">
                    Head to the <a href="marketplace.html">Marketplace</a> and save items that interest you.
                </p>
            </div>

        </div>
    </div>

    <footer class="page-footer">
        Campus Marketplace &copy; 2026 · Macquarie University
    </footer>

    <!-- Firebase script -->
    <script type="module">
        import { initializeApp }    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
        import { getFirestore, collection, query, where, getDocs, doc, getDoc, deleteDoc }
            from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        // Firebase project config
        const firebaseConfig = {
            apiKey:            "AIzaSyB0mfNZJtuwNUudgM83nX7soxlsXdwfs3A",
            authDomain:        "comp2750-a3.firebaseapp.com",
            projectId:         "comp2750-a3",
            storageBucket:     "comp2750-a3.firebasestorage.app",
            messagingSenderId: "671623399244",
            appId:             "1:671623399244:web:99e442a49e22d3090ff1e9"
        };

        // start Firebase
        const app  = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db   = getFirestore(app);

        // check if user is logged in - redirect to login if not
        onAuthStateChanged(auth, async function(user) {
            if (!user) {
                window.location.href = "login.html";
                return;
            }
            await loadShortlist(user);
        });

        // load the user's shortlisted items
        async function loadShortlist(user) {
            const container  = document.getElementById("shortlistContainer");
            const loadingMsg = document.getElementById("loadingMsg");
            const emptyMsg   = document.getElementById("emptyMsg");

            try {
                // get all shortlist documents for this user
                const q        = query(collection(db, "shortlists"), where("userId", "==", user.uid));
                const snapshot = await getDocs(q);

                loadingMsg.style.display = "none";

                if (snapshot.empty) {
                    emptyMsg.style.display = "block";
                    return;
                }

                container.style.display = "block";

                for (const shortlistDoc of snapshot.docs) {
                    const { itemId } = shortlistDoc.data();

                    // fetch the full item details from the items collection
                    const itemSnap = await getDoc(doc(db, "items", itemId));
                    if (!itemSnap.exists()) continue;

                    const item = itemSnap.data();
                    const priceLabel = (item.price === "Trade" || item.price === 0 || item.price === "")
                        ? "Trade"
                        : "$" + item.price;

                    const row = document.createElement("div");
                    row.className = "shortlist-item";
                    row.dataset.docId = shortlistDoc.id;
                    row.innerHTML = `
                        <div class="shortlist-item-info">
                            <p class="shortlist-item-name">${item.name}</p>
                            <p class="shortlist-item-meta">${item.category || "Other"} · Seller: ${item.sellerEmail}</p>
                        </div>
                        <span class="shortlist-item-price">${priceLabel}</span>
                        <button class="btn-remove" data-doc-id="${shortlistDoc.id}">Remove</button>
                    `;
                    container.appendChild(row);
                }

                addRemoveListeners();

            } catch (err) {
                loadingMsg.innerHTML = `<p class="text-danger">Error loading shortlist. Please refresh.</p>`;
                console.error(err);
            }
        }

        // attach click listeners to remove buttons
        function addRemoveListeners() {
            document.querySelectorAll(".btn-remove").forEach(function(btn) {
                btn.addEventListener("click", async function() {
                    const docId = btn.dataset.docId;
                    btn.disabled = true;
                    btn.textContent = "Removing…";

                    try {
                        await deleteDoc(doc(db, "shortlists", docId));

                        // remove the row from the page
                        const row = document.querySelector(`.shortlist-item[data-doc-id="${docId}"]`);
                        if (row) row.remove();

                        // show empty state if nothing is left
                        const remaining = document.querySelectorAll(".shortlist-item").length;
                        if (remaining === 0) {
                            document.getElementById("shortlistContainer").style.display = "none";
                            document.getElementById("emptyMsg").style.display = "block";
                        }

                    } catch (err) {
                        btn.disabled = false;
                        btn.textContent = "Remove";
                        alert("Could not remove item. Please try again.");
                        console.error(err);
                    }
                });
            });
        }

        // sign out button
        document.getElementById("signOutBtn").addEventListener("click", async function() {
            await signOut(auth);
            window.location.href = "login.html";
        });
    </script>

</body>
</html>
